<!-- CairnTab toolbar icon for 16, 32 and 48 px: three stones, full-bleed background, no padding,
     because four stones inside Chrome's padded 128 layout blur into one blob at 16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <rect width="16" height="16" rx="3.5" fill="#2F3B35"/>
  <g stroke="#2F3B35" stroke-width="0.7">
    <ellipse cx="8" cy="12.1" rx="5.7" ry="2.1" fill="#E8E2D4"/>
    <ellipse cx="7.7" cy="8.6" rx="3.9" ry="1.75" fill="#DCD5C5" transform="rotate(-5 7.7 8.6)"/>
    <ellipse cx="8.2" cy="5.4" rx="2.5" ry="1.6" fill="#E7A14C" transform="rotate(-7 8.2 5.4)"/>
  </g>
</svg>
